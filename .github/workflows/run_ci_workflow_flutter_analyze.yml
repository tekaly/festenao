# New default (preferred over run_ci_action_flutter_analyze.yml and
# run_ci_flutter_downgrade_analyze.yml): analyze after pub get and after pub
# downgrade, each step being a separate job.
name: Run CI workflow flutter analyze
on:
  # No run on push (2026-10-25): run it by hand (workflow_dispatch) or wait
  # for the weekly run.
  # push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # every sunday at midnight

jobs:
  ci:
    name: Run ci
    uses: tekartik/ci.dart/.github/workflows/run_ci_flutter_analyze_jobs.yml@v1
