name: festenao_jaspr
description: >-
  Shared jaspr components of the festenao and youpi static sites: two
  language texts, the page head (canonical, hreflang, OpenGraph, JSON-LD),
  the language link with the Firebase Hosting language cookie, markdown
  pages, FAQ list, inline rich text, images and store badges.
version: 0.1.1
publish_to: none

resolution: workspace
environment:
  sdk: ^3.12.0

# Light on purpose: the sites using it are small standalone packages
# (jaspr_builder in their dev dependencies). Never add festenao_common,
# tkcms_common or anything pulling the Firebase admin sdk. No @client
# component here: islands need jaspr_builder in the declaring package.
dependencies:
  # A floor only: each site resolves it (0.24 beta, the first on analyzer
  # 13+, Dart 3.14).
  jaspr: ">=0.24.0-beta.0"
  markdown: ">=7.3.0"
  path: ">=1.9.1"

dev_dependencies:
  jaspr_test: ">=0.24.0-beta.0"
  test: ">=1.31.0"
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints
    version: '>=0.1.0'
