name: festenao_firebase
description: Firestore security rules as code - imperative rules builder, in-memory rules simulator, emulator harness and the tkcms/festenao rule sets.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  collection: ">=1.19.1"
  http: ">=1.2.0"
  meta: ">=1.18.0"
  path: ">=1.9.1"
  tekartik_common_utils:
    git:
      url: https://github.com/tekartik/common_utils.dart
  tekartik_firebase:
    git:
      url: https://github.com/tekartik/firebase.dart
      path: firebase
  tekartik_firebase_auth:
    git:
      url: https://github.com/tekartik/firebase_auth.dart
      path: auth
  tekartik_firebase_firestore:
    git:
      url: https://github.com/tekartik/firebase_firestore.dart
      path: firestore
  tekartik_firebase_firestore_sembast:
    git:
      url: https://github.com/tekartik/firebase_firestore.dart
      path: firestore_sembast
  tekartik_firebase_auth_sembast:
    git:
      url: https://github.com/tekartik/firebase_auth.dart
      path: auth_sembast
  tekartik_firebase_local:
    git:
      url: https://github.com/tekartik/firebase.dart
      path: firebase_local
  tekartik_firebase_emulator:
    git:
      url: https://github.com/tekartik/firebase_node.dart
      path: firebase_emulator
  tekartik_firebase_rest:
    git:
      url: https://github.com/tekartik/firebase_rest.dart
      path: firebase_rest
  tekartik_firebase_auth_rest:
    git:
      url: https://github.com/tekartik/firebase_rest.dart
      path: auth_rest
  tekartik_firebase_firestore_rest:
    git:
      url: https://github.com/tekartik/firebase_rest.dart
      path: firestore_rest
  tkcms_common:
    git:
      url: https://github.com/tekartikprj/tkcms.git
      path: packages/tkcms_common
  dev_test: ">=1.0.1"

dev_dependencies:
  lints: ">=6.1.0"
  test: ">=1.31.0"
  dev_build: ">=1.1.8+2"
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints
  festenao_common:
    path: ../festenao_common

resolution: workspace
