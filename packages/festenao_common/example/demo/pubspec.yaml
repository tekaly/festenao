version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  festenao_common:
    git:
      url: https://github.com/tekaly/festenao
      path: packages/festenao_common

dev_dependencies:
  test: ">=1.24.0"
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints
resolution: workspace
