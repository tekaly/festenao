name: festenao_youtube_player
description: "Youtube players for flutter: a single video widget, and a playlist backend."
version: 0.1.0
homepage:
publish_to: none
environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # Youtube's own player, the only thing a browser can use: it cannot reach
  # youtube's pages or media urls across origins.
  youtube_player_iframe: ">=5.2.2"
  # Everywhere else the media urls are resolved and played directly.
  #
  # media_kit_video 2.0 is required: it moved the linux h/w renderer from
  # GdkGLContext to EGL, which is what flutter 3.38+ needs. y_player, which
  # this package used to play video off the web, pins media_kit_video ^1.3.0
  # and so cannot be used until it relaxes that.
  media_kit: ">=1.1.10"
  media_kit_video: ">=2.0.1"
  media_kit_libs_video: ">=1.0.4"
  youtube_explode_dart: ">=3.1.0"
  http: ">=1.6.0"
  festenao_common_flutter:
    git:
      url: https://github.com/tekaly/festenao
      path: packages_flutter/festenao_common_flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=6.0.0"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
resolution: workspace

