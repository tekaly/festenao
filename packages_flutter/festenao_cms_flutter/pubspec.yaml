name: festenao_cms_flutter
description: "Festenao mini CMS editor: list, edit, preview and publish the pages of a content database, and browse the html site they render to (riverpod, material)."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ">=3.0.0"
  festenao_common:
    git:
      url: https://github.com/tekaly/festenao
      path: packages/festenao_common
  festenao_markdown:
    git:
      url: https://github.com/tekaly/festenao
      path: packages_flutter/festenao_markdown
  # The generated html, rendered as widgets (no webview: linux and web alike).
  flutter_widget_from_html_core: ">=0.17.2"
  html: ">=0.15.5"
  # The browser rendering of the generated html (a sandboxed iframe, web only).
  web: ">=1.1.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=6.0.0"
  tekartik_lints_flutter:
    git:
      url: https://github.com/tekartik/common_flutter.dart
      path: packages/lints_flutter

flutter:
  uses-material-design: true
resolution: workspace
