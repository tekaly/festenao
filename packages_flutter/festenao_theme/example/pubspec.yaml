name: festenao_theme_example
description: "Festenao themes gallery: every preset, light and dark, on sample festival screens."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  festenao_theme:
    git:
      url: https://github.com/tekaly/festenao
      path: packages_flutter/festenao_theme
  material_ui: ">=1.5.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  tekartik_lints_flutter:
    git:
      url: https://github.com/tekartik/common_flutter.dart
      path: packages/lints_flutter

flutter:
  uses-material-design: true

  # The themes ask for the bare `Poppins` and `JetBrains Mono` families
  # (festenao_theme), which only resolve when the app declares them.
  fonts:
    - family: Poppins
      fonts:
        - asset: packages/festenao_theme/fonts/poppins/Poppins-Regular.ttf
        - asset: packages/festenao_theme/fonts/poppins/Poppins-Italic.ttf
          style: italic
        - asset: packages/festenao_theme/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: packages/festenao_theme/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: packages/festenao_theme/fonts/poppins/Poppins-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: packages/festenao_theme/fonts/jetbrains_mono/JetBrainsMonoNL-Regular.ttf
        - asset: packages/festenao_theme/fonts/jetbrains_mono/JetBrainsMonoNL-Medium.ttf
          weight: 500
        - asset: packages/festenao_theme/fonts/jetbrains_mono/JetBrainsMonoNL-SemiBold.ttf
          weight: 600
        - asset: packages/festenao_theme/fonts/jetbrains_mono/JetBrainsMonoNL-Bold.ttf
          weight: 700

resolution: workspace
