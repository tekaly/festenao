name: festenao_theme
description: "Flutter ui and theme helpers"
version: 0.0.1
homepage:
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  tekartik_app_flutter_common_utils:
    git:
      url: https://github.com/tekartik/app_flutter_utils.dart
      path: app_common
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=6.0.0"
  tekartik_lints_flutter:
    git:
      url: https://github.com/tekartik/common_flutter.dart
      path: packages/lints_flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  assets:
    - packages/festenao_theme/fonts/poppins/OFL.txt
    - packages/festenao_theme/fonts/jetbrains_mono/OFL.txt

  # Bundled as plain Flutter fonts, not through google_fonts: a weight asks
  # the engine for the matching file directly, offline and without the
  # runtime fetch (and its "not found in assets" failure) google_fonts hits
  # when network access is off. The font files sit under `lib/` (so
  # `rootBundle` can also serve them to another package as
  # `packages/festenao_theme/fonts/...`), so the path here needs the `lib/`
  # a package's own pubspec doesn't add for you.
  fonts:
    - family: Poppins
      fonts:
        - asset: lib/fonts/poppins/Poppins-Regular.ttf
        - asset: lib/fonts/poppins/Poppins-Italic.ttf
          style: italic
        - asset: lib/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: lib/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: lib/fonts/poppins/Poppins-Bold.ttf
          weight: 700
    # The monospace family the explorers draw hex dumps and raw text with:
    # JetBrains Mono, built for reading code and bytes — a slashed zero and
    # a dotted one so `0`/`O` and `1`/`l`/`I` never get mistaken for each
    # other. The "NL" (no ligatures) cut is used on purpose: a hex dump
    # wants every byte pair drawn as itself, not merged into a ligature.
    - family: JetBrains Mono
      fonts:
        - asset: lib/fonts/jetbrains_mono/JetBrainsMonoNL-Regular.ttf
        - asset: lib/fonts/jetbrains_mono/JetBrainsMonoNL-Medium.ttf
          weight: 500
        - asset: lib/fonts/jetbrains_mono/JetBrainsMonoNL-SemiBold.ttf
          weight: 600
        - asset: lib/fonts/jetbrains_mono/JetBrainsMonoNL-Bold.ttf
          weight: 700

resolution: workspace
