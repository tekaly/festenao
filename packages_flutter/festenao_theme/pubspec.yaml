name: festenao_theme
description: "Flutter ui and theme helpers"
version: 0.0.1
homepage:
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  tekartik_app_flutter_common_utils:
    git:
      url: https://github.com/tekartik/app_flutter_utils.dart
      path: app_common
  material_ui: ">=1.5.0"
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=6.0.0"
  tekartik_lints_flutter:
    git:
      url: https://github.com/tekartik/common_flutter.dart
      path: packages/lints_flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The font files are plain assets, registered at runtime under their bare
  # family names (`Poppins`, `JetBrains Mono`) by `loadFestenaoFonts()`: a
  # family declared here would only be reachable as
  # `packages/festenao_theme/<family>`, and on the web every declared family
  # is downloaded before the first frame, used or not
  # (`doc/font_managment.md`). The self-prefixed form gives the same asset
  # keys as an app declaring these files itself, so they are bundled once.
  # The files sit under `lib/`, `packages/festenao_theme/` maps to it.
  assets:
    - packages/festenao_theme/fonts/poppins/OFL.txt
    - packages/festenao_theme/fonts/poppins/Poppins-Regular.ttf
    - packages/festenao_theme/fonts/poppins/Poppins-Italic.ttf
    - packages/festenao_theme/fonts/poppins/Poppins-Medium.ttf
    - packages/festenao_theme/fonts/poppins/Poppins-SemiBold.ttf
    - packages/festenao_theme/fonts/poppins/Poppins-Bold.ttf
    - packages/festenao_theme/fonts/poppins/Poppins-ExtraBold.ttf
    # The monospace family the explorers draw hex dumps and raw text with:
    # JetBrains Mono, built for reading code and bytes — a slashed zero and
    # a dotted one so `0`/`O` and `1`/`l`/`I` never get mistaken for each
    # other. The "NL" (no ligatures) cut is used on purpose: a hex dump
    # wants every byte pair drawn as itself, not merged into a ligature.
    - packages/festenao_theme/fonts/jetbrains_mono/OFL.txt
    - packages/festenao_theme/fonts/jetbrains_mono/JetBrainsMonoNL-Regular.ttf
    - packages/festenao_theme/fonts/jetbrains_mono/JetBrainsMonoNL-Medium.ttf
    - packages/festenao_theme/fonts/jetbrains_mono/JetBrainsMonoNL-SemiBold.ttf
    - packages/festenao_theme/fonts/jetbrains_mono/JetBrainsMonoNL-Bold.ttf

resolution: workspace
