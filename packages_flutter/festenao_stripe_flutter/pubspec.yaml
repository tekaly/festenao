name: festenao_stripe_flutter
description: >-
  A small Stripe back office for Flutter (web included): dashboard, products,
  prices, sales, payments, payment links, payouts and account, for several
  Stripe keys ("clients") kept on the device (sdb).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ">=1.5.0"
  cv: ">=1.1.11"
  http: ">=1.5.0"
  idb_shim: ">=2.11.2"
  tekartik_stripe_api:
    git:
      url: https://github.com/alextekartik/http_apis.dart
      path: packages/stripe
    version: '>=1.6.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=6.0.0"
  tekartik_lints_flutter:
    git:
      url: https://github.com/tekartik/common_flutter.dart
      path: packages/lints_flutter

flutter:
  uses-material-design: true

resolution: workspace
