name: festenao_dashboard_app_demo
description: "Festenao dashboard explorers and cms demo: everything in memory."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ">=1.0.9"
  # The cms content (Flutter free, shared with bin/).
  festenao_common:
    git:
      url: https://github.com/tekaly/festenao
      path: packages/festenao_common
  # The dart http functions of bin/server.dart and bin/server_ff_app.dart.
  festenao_dartff:
    git:
      url: https://github.com/tekaly/festenao
      path: packages/festenao_dartff
  # The cms screens, on pages seeded in memory.
  festenao_cms_flutter:
    git:
      url: https://github.com/tekaly/festenao
      path: packages_flutter/festenao_cms_flutter
  festenao_common_flutter:
    git:
      url: https://github.com/tekaly/festenao
      path: packages_flutter/festenao_common_flutter
  # The poppins themes the demo swaps between.
  festenao_theme:
    git:
      url: https://github.com/tekaly/festenao
      path: packages_flutter/festenao_theme
  # The in memory backends the demo runs on.
  fs_shim: ">=2.5.5"
  idb_shim: ">=2.9.10-1"
  sembast: ">=3.8.5+1"
  # The users of the users explorer, in an in memory sdb auth.
  tekartik_firebase_auth_sdb:
    git:
      url: https://github.com/tekartik/firebase_auth.dart
      path: auth_sdb
  tekartik_firebase_firestore:
    git:
      url: https://github.com/tekartik/firebase_firestore.dart
      path: firestore
  tekartik_firebase_firestore_sembast:
    git:
      url: https://github.com/tekartik/firebase_firestore.dart
      path: firestore_sembast
  tkcms_common:
    git:
      url: https://github.com/tekartikprj/tkcms.git
      path: packages/tkcms_common

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The servers served in memory, in the tests.
  tekartik_http:
    git:
      url: https://github.com/tekartik/http.dart
      path: http
  flutter_lints: ">=6.0.0"

flutter:
  uses-material-design: true
resolution: workspace
